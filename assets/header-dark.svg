<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Jeevan, full-stack TypeScript developer and open-source contributor">
<title>Jeevan, full-stack TypeScript developer and open-source contributor</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"><animate attributeName="stop-color" values="#2dd4bf;#8b5cf6;#38bdf8;#2dd4bf" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#38bdf8;#2dd4bf;#8b5cf6" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2b3b5c" stroke-width="1" opacity="0.45"/></pattern>
</defs>
<style>
  .blob { transform-box: fill-box; transform-origin: center; }
  .b1 { animation: drift1 14s ease-in-out infinite; }
  .b2 { animation: drift2 18s ease-in-out infinite; }
  .b3 { animation: drift3 22s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px,40px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(110px,-30px) scale(0.9); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px,-50px); } }
  .hello { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) .1s forwards; }
  .name { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .25s forwards; }
  .underline { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.2s ease-out .7s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .role { opacity: 0; animation: cycle 12s infinite; }
  .r1 { animation-delay: 4s; }
  .r2 { animation-delay: 8s; }
  @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 4%,29% { opacity: 1; transform: none; } 33%,100% { opacity: 0; transform: translateY(-10px); } }
  .chip { opacity: 0; animation: rise .6s ease-out forwards; }
  .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }
  .orbit { transform-origin: 1010px 150px; animation: spin 26s linear infinite; }
  .orbit2 { transform-origin: 1010px 150px; animation: spin 40s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .hello, .name, .chip, .r0 { opacity: 1 !important; }
    .underline { stroke-dashoffset: 0 !important; }
  }
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle class="blob b1" cx="980" cy="70" r="220" fill="url(#glowA)"/>
  <circle class="blob b2" cx="760" cy="290" r="240" fill="url(#glowB)"/>
  <circle class="blob b3" cx="1150" cy="260" r="180" fill="url(#glowC)"/>
  <g class="orbit"><circle cx="1010" cy="150" r="92" fill="none" stroke="#2dd4bf" stroke-opacity=".45" stroke-dasharray="4 10"/><circle cx="1102" cy="150" r="7" fill="#2dd4bf"/></g>
  <g class="orbit2"><circle cx="1010" cy="150" r="58" fill="none" stroke="#8b5cf6" stroke-opacity=".5" stroke-dasharray="2 8"/><circle cx="952" cy="150" r="5" fill="#8b5cf6"/></g>
  <circle cx="1010" cy="150" r="26" fill="#16213a" stroke="#2b3b5c"/>
  <text x="1010" y="157" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#2dd4bf">&lt;/&gt;</text>
</g>
<text class="hello" x="74" y="76" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" fill="#9fb0c3">Hi, I&#39;m</text>
<text class="name" x="70" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1">Jeevan</text>
<path class="underline" d="M74 146 C 140 156, 230 140, 312 148" fill="none" stroke="url(#name)" stroke-width="4" stroke-linecap="round"/>
<text class="role r0" x="72" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c3">Full-stack TypeScript developer</text>
<text class="role r1" x="72" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c3">Open-source contributor · LibreDB · Lingui</text>
<text class="role r2" x="72" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0c3">Next.js · Node.js · Supabase · Three.js</text>
<g class="chip" style="animation-delay:0.90s">
  <rect x="72" y="214" rx="15" width="163" height="30" fill="#16213a" stroke="#2b3b5c"/>
  <text x="86" y="234" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#2dd4bf" font-weight="700">5</text>
  <text x="102.4" y="234" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d6e3">merged OSS PRs</text>
</g>
<g class="chip" style="animation-delay:1.05s">
  <rect x="247" y="214" rx="15" width="154.39999999999998" height="30" fill="#16213a" stroke="#2b3b5c"/>
  <text x="261" y="234" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#2dd4bf" font-weight="700">7</text>
  <text x="277.4" y="234" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d6e3">live projects</text>
</g>
<g class="chip" style="animation-delay:1.20s">
  <rect x="413.4" y="214" rx="15" width="94.19999999999999" height="30" fill="#16213a" stroke="#2b3b5c"/>
  <text x="427.4" y="234" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#2dd4bf" font-weight="700">TS</text>
  <text x="452.2" y="234" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d6e3">first</text>
</g>
<g><circle class="dot" cx="537.5999999999999" cy="229" r="5" fill="#22c55e"/><text x="549.5999999999999" y="234" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#9fb0c3">open to freelance &amp; junior roles</text></g>
<rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#2b3b5c"/>
</svg>
